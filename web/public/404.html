  <head>

    <title>AGIES ALERT</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects to root with preserved query/path
      sessionStorage.redirect = location.href;
      location.replace(location.pathname.split('/')[1] ? '/' + location.pathname.split('/')[1] + '/' : '/');
    </script>
