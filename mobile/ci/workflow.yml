name: Aegis Alert CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  validate-and-build:
    name: Test, Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Type Check
        run: npm run check

      - name: Run Automated Test Suite (Vitest)
        run: npm run test

      - name: Run Expo Linter
        run: npm run lint

      - name: Build Server Distribution
        run: npm run build

      - name: Build Expo Web Production Bundle
        run: npx expo export --platform web
